<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4efe8">
<title>Invitación</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#f4efe8}
body{overflow-x:hidden;color:#222;font-family:Arial,sans-serif}
.invitation{position:relative;width:min(100vw,1100px);margin:auto;line-height:0;background:#f4efe8;min-height:100vh}
#svgHost{width:100%;line-height:0}
#svgHost svg{display:block;width:100%;height:auto;overflow:visible}
#svgHost svg image{transform-box:fill-box;transform-origin:center;will-change:transform}
#svgHost svg image.photo-float-1{animation:floatOne 8s ease-in-out infinite}
#svgHost svg image.photo-float-2{animation:floatTwo 10s ease-in-out infinite}
#svgHost svg image.photo-float-3{animation:floatThree 9s ease-in-out infinite}
#svgHost svg image.photo-float-4{animation:floatFour 11s ease-in-out infinite}
#svgHost svg image.photo-float-5{animation:floatFive 9.5s ease-in-out infinite}
#svgHost svg image.photo-float-6{animation:floatSix 12s ease-in-out infinite}
#svgHost svg image.photo-float-7{animation:floatSeven 10.5s ease-in-out infinite}
#svgHost svg image.photo-float-8{animation:floatEight 13s ease-in-out infinite}
@keyframes floatOne{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(0,-5px) scale(1.008)}}
@keyframes floatTwo{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(5px,0) scale(1.012)}}
@keyframes floatThree{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-4px,4px) scale(1.01)}}
@keyframes floatFour{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(3px,-4px) rotate(.35deg)}}
@keyframes floatFive{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-5px,0) scale(1.01)}}
@keyframes floatSix{0%,100%{transform:translate(0,0)}50%{transform:translate(0,5px)}}
@keyframes floatSeven{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(4px,3px) scale(1.008)}}
@keyframes floatEight{0%,100%{transform:translate(0,0)}50%{transform:translate(-3px,-4px)}}

/* El nombre se escribe como una máquina de escribir sobre el nombre original */
.name-typewriter{position:absolute;top:0;left:0;width:100%;height:4.45%;background:#f4efe8;z-index:5;display:flex;align-items:center;justify-content:center;overflow:hidden;pointer-events:none}
.name-typewriter .name{margin-top:-.1%;font-family:"Courier New",monospace;font-size:clamp(19px,5vw,58px);font-weight:400;letter-spacing:-1.5px;color:#24201c;white-space:nowrap;line-height:1}
.name-typewriter .cursor{display:inline-block;width:.06em;height:1.02em;background:#24201c;margin-left:.08em;vertical-align:-.08em;animation:blink .75s steps(1,end) infinite}
.name-typewriter.done .cursor{animation:blink .9s steps(1,end) infinite}
@keyframes blink{50%{opacity:0}}

@media(prefers-reduced-motion:reduce){#svgHost svg image{animation:none!important}.name-typewriter .cursor{animation:none}}
.controls{position:fixed;right:18px;bottom:18px;z-index:20;display:flex;gap:8px;align-items:center}
.action{border:0;border-radius:999px;padding:12px 17px;background:rgba(28,28,28,.92);color:#fff;font:600 14px/1 Arial,sans-serif;cursor:pointer;box-shadow:0 8px 25px rgba(0,0,0,.2);backdrop-filter:blur(8px)}
.action:hover{background:#111;transform:translateY(-1px)}
.modal{position:fixed;inset:0;z-index:100;background:rgba(25,25,25,.48);display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(6px)}
.modal.open{display:flex}
.card{width:min(100%,460px);max-height:92vh;overflow:auto;background:#f8f4ee;border-radius:22px;padding:26px;box-shadow:0 25px 70px rgba(0,0,0,.28);line-height:normal}
.card h2{margin:0 0 6px;font:600 28px/1.15 Georgia,serif;color:#24201c;text-align:center}
.card p{margin:0 0 18px;text-align:center;color:#68615a;font-size:14px}
.field{margin:0 0 13px}.field label{display:block;font-size:13px;font-weight:700;color:#4b453f;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #d6cec4;border-radius:12px;padding:11px 12px;background:#fff;color:#25211e;font:14px Arial,sans-serif;outline:none}.field textarea{min-height:80px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#9d8f80;box-shadow:0 0 0 3px rgba(157,143,128,.12)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.buttons{display:flex;gap:9px;margin-top:18px}.buttons button{flex:1;border:0;border-radius:12px;padding:12px;cursor:pointer;font-weight:700}.cancel{background:#e6dfd7;color:#3b3631}.send{background:#28231f;color:#fff}.success{display:none;text-align:center;padding:18px 4px}.success strong{display:block;font:600 24px Georgia,serif;margin-bottom:8px}.success span{color:#68615a;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:rgba(20,20,20,.92);color:#fff;padding:10px 16px;border-radius:10px;font:14px Arial,sans-serif;opacity:0;pointer-events:none;transition:.25s;z-index:150;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:560px){.controls{right:10px;bottom:10px;left:10px}.action{flex:1;font-size:12px;padding:11px 12px}.card{padding:21px}.row{grid-template-columns:1fr}.card h2{font-size:24px}.name-typewriter{height:4.55%}.name-typewriter .name{font-size:clamp(15px,5vw,42px);letter-spacing:-1px}}
</style>
</head>
<body>
<main class="invitation" aria-label="Invitación digital">
  <div id="svgHost" aria-label="Diseño de la invitación"></div>
  <div class="name-typewriter" aria-label="Nombre de los novios">
    <div class="name" id="typedName"></div><span class="cursor" id="cursor"></span>
  </div>
</main>
<div class="controls">
  <button class="action" id="shareBtn" type="button">Compartir</button>
  <button class="action" id="rsvpBtn" type="button">Confirmar asistencia</button>
</div>
<div class="modal" id="rsvpModal" role="dialog" aria-modal="true" aria-labelledby="rsvpTitle">
  <section class="card">
    <div id="formView">
      <h2 id="rsvpTitle">Confirma tu asistencia</h2>
      <p>Nos encantará saber si podrás acompañarnos.</p>
      <form id="rsvpForm">
        <div class="field"><label for="name">Nombre completo</label><input id="name" name="name" required autocomplete="name" placeholder="Escribe tu nombre"></div>
        <div class="field"><label for="attendance">¿Asistirás?</label><select id="attendance" name="attendance" required><option value="">Selecciona una opción</option><option value="Sí asistiré">Sí, asistiré</option><option value="No podré asistir">No podré asistir</option></select></div>
        <div class="row"><div class="field"><label for="guests">Acompañantes</label><select id="guests" name="guests"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option></select></div><div class="field"><label for="phone">Teléfono</label><input id="phone" name="phone" inputmode="tel" placeholder="Opcional"></div></div>
        <div class="field"><label for="message">Mensaje</label><textarea id="message" name="message" placeholder="Un mensaje para los novios (opcional)"></textarea></div>
        <div class="buttons"><button class="cancel" type="button" id="closeBtn">Cerrar</button><button class="send" type="submit">Enviar confirmación</button></div>
      </form>
    </div>
    <div class="success" id="successView"><strong>¡Gracias!</strong><span>Tu confirmación quedó registrada en este dispositivo.</span><div class="buttons"><button class="send" type="button" id="doneBtn">Listo</button></div></div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const SVG_FILE='invitacion%20(2).svg';
const host=document.getElementById('svgHost');
const modal=document.getElementById('rsvpModal');
const form=document.getElementById('rsvpForm');
const toast=document.getElementById('toast');
const typedName=document.getElementById('typedName');
const typewriter=document.querySelector('.name-typewriter');
function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>toast.classList.remove('show'),2200)}
async function loadInvitation(){
 try{
  const response=await fetch(SVG_FILE,{cache:'no-store'});
  if(!response.ok)throw new Error('No se pudo cargar la invitación');
  const text=await response.text();
  const doc=new DOMParser().parseFromString(text,'image/svg+xml');
  const svg=doc.documentElement;
  host.replaceChildren(document.importNode(svg,true));
  host.querySelectorAll('svg image').forEach((img,i)=>img.classList.add(`photo-float-${(i%8)+1}`));
 }catch(error){host.innerHTML='<p style="padding:30px;text-align:center;line-height:1.5">No se pudo cargar la invitación. Recarga la página.</p>';console.error(error)}
}
function typeName(){
 const text='Aerin and May';
 typedName.textContent='';
 let i=0;
 const tick=()=>{if(i<text.length){typedName.textContent+=text.charAt(i++);setTimeout(tick,115)}else typewriter.classList.add('done')};
 setTimeout(tick,650);
}
function openModal(){modal.classList.add('open');document.body.style.overflow='hidden';document.getElementById('name').focus()}
function closeModal(){modal.classList.remove('open');document.body.style.overflow=''}
document.getElementById('rsvpBtn').addEventListener('click',openModal);
document.getElementById('closeBtn').addEventListener('click',closeModal);
document.getElementById('doneBtn').addEventListener('click',closeModal);
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
form.addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form).entries());data.createdAt=new Date().toISOString();const previous=JSON.parse(localStorage.getItem('invitacion_rsvp')||'[]');previous.push(data);localStorage.setItem('invitacion_rsvp',JSON.stringify(previous));document.getElementById('formView').style.display='none';document.getElementById('successView').style.display='block'});
document.getElementById('shareBtn').addEventListener('click',async()=>{const data={title:document.title,text:'Te comparto esta invitación',url:location.href};try{if(navigator.share)await navigator.share(data);else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);showToast('Enlace copiado')}else showToast('Copia el enlace para compartirlo')}catch(e){}});
loadInvitation();
typeName();
</script>
</body>
</html>
