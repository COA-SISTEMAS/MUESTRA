<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4efe8">
<title>Invitación</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#f4efe8}
body{display:flex;justify-content:center;overflow-x:hidden}
.invitation{position:relative;width:min(100vw,1100px);line-height:0;background:#f4efe8}
.invitation img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.actions{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;justify-content:center;line-height:normal;z-index:10;opacity:0;transition:opacity .3s ease}
.invitation:hover .actions,.actions:focus-within{opacity:1}
.action{border:0;border-radius:999px;padding:11px 18px;background:rgba(25,25,25,.88);color:#fff;font:600 14px/1 Arial,sans-serif;cursor:pointer;box-shadow:0 5px 20px rgba(0,0,0,.18)}
.action:hover{background:#111}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:rgba(20,20,20,.92);color:#fff;padding:10px 16px;border-radius:10px;font:14px Arial,sans-serif;opacity:0;pointer-events:none;transition:.25s;z-index:50;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (hover:none){.actions{opacity:1;bottom:1.5%}.action{font-size:12px;padding:9px 13px}}
</style>
</head>
<body>
<main class="invitation" aria-label="Invitación digital">
  <img src="invitacion%20(2).svg" alt="Invitación digital" draggable="false">
  <div class="actions">
    <button class="action" id="shareBtn" type="button">Compartir</button>
    <button class="action" id="topBtn" type="button">Inicio</button>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const toast=document.getElementById('toast');
function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>toast.classList.remove('show'),2200)}
document.getElementById('topBtn').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
document.getElementById('shareBtn').addEventListener('click',async()=>{
 const data={title:document.title,text:'Te comparto esta invitación',url:location.href};
 try{
   if(navigator.share){await navigator.share(data)}
   else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);showToast('Enlace copiado')}
   else showToast('Copia el enlace de esta página para compartirla');
 }catch(e){}
});
</script>
</body>
</html>
